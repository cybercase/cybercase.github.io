version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Not supported yet by the lint stack (as of 2026-11): eslint-plugin-react
      # peers eslint <=9, typescript-eslint peers typescript <6.1.
      # Remove these once both declare support.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      markdown:
        patterns:
          - "unified"
          - "remark-*"
          - "rehype-*"
          - "katex"
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
